name: Photon Release

on:
  push:
    tags: ["openclaw-v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and sign OpenClaw image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      COSIGN_VERSION: v3.1.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag and release configuration
        id: guard
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          HAS_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::release must run from a tag ref named openclaw-v<version> (got $REF_TYPE '$REF_NAME')"
            exit 1
          fi
          case "$REF_NAME" in
            openclaw-v?*) ;;
            *)
              echo "::error::tag '$REF_NAME' does not match openclaw-v<version>"
              exit 1
              ;;
          esac
          tag_version="${REF_NAME#openclaw-v}"
          dockerfile_version="$(sed -n 's/^ARG OPENCLAW_VERSION=//p' Dockerfile.openclaw | head -n 1)"
          if [ -z "$dockerfile_version" ]; then
            echo "::error::no 'ARG OPENCLAW_VERSION=' default found in Dockerfile.openclaw"
            exit 1
          fi
          if [ "$tag_version" != "$dockerfile_version" ]; then
            echo "::error::tag version '$tag_version' does not match Dockerfile.openclaw OPENCLAW_VERSION '$dockerfile_version'"
            exit 1
          fi
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::repository variable DOCKERHUB_NAMESPACE is empty or unset"
            exit 1
          fi
          if [ "$HAS_DOCKERHUB_USERNAME" != "true" ] || [ "$HAS_DOCKERHUB_TOKEN" != "true" ]; then
            echo "::error::secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be set"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Build and push multi-arch image
        env:
          ENV_FILE: /nonexistent
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          IMAGE_TAG: ${{ steps.guard.outputs.version }}
          PUSH_LATEST: "1"
        run: ./publish-openclaw-local-dockerfile.sh

      - name: Sign and verify image by digest
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          IMAGE_TAG: ${{ steps.guard.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          image="${DOCKERHUB_NAMESPACE}/openclaw"
          digest="$(docker buildx imagetools inspect "${image}:${IMAGE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve manifest digest for ${image}:${IMAGE_TAG} (got '$digest')"
            exit 1
          fi
          cosign sign --yes "${image}@${digest}"
          cosign verify \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${image}@${digest}"
          {
            echo "### Signed OpenClaw image"
            echo
            echo "\`${image}@${digest}\`"
            echo
            echo "Tags: \`${IMAGE_TAG}\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
